<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>ACP</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="navigator">
  <div id="nav-header">
    <span class="nav-title">Sessions</span>
    <button class="nav-btn" id="sort-btn">Recent</button>
    <button class="nav-btn" id="spawn-btn">+</button>
    <button class="nav-btn" id="select-btn">Select</button>
    <button class="nav-btn" id="batch-delete-btn" style="display:none;color:#F44336">Delete</button>
    <button class="nav-btn" id="refresh-btn">&#8635;</button>
    <button class="nav-btn" id="settings-btn" title="Settings">&#9881;</button>
  </div>
  <div id="settings-panel">
    <label for="tts-rate-slider">Speech rate</label>
    <input type="range" id="tts-rate-slider" min="0.5" max="2" step="0.1" value="1">
    <span id="tts-rate-value">1.0×</span>
  </div>
  <div id="nav-list"></div>
</div>
<div id="chat-view">
<div id="header">
  <button class="back-btn" id="back-btn">&larr;</button>
  <div class="header-info">
    <div class="header-title" id="header-title">ACP</div>
    <div class="header-sub">
      <span class="header-status" id="status-text">Connecting...</span>
      <button class="mode-btn" id="mode-btn" style="display:none">Ask</button>
    </div>
  </div>
  <div class="header-actions">
    <button class="header-action-btn files-btn" id="files-btn">Files</button>
    <button class="header-action-btn files-btn" id="kill-btn" style="color:#F44336;border-color:#F44336;display:none">Kill</button>
    <button class="header-action-btn notification-btn" id="notification-btn" title="Toggle Notifications">🔔</button>
    <button class="header-action-btn notification-btn" id="autospeak-btn" title="Auto-speak">🗣</button>
  </div>
</div>
<div id="file-browser">
  <div id="fb-header">
    <button class="fb-back" id="fb-back">&larr;</button>
    <span class="fb-path" id="fb-path"></span>
    <button class="fb-hidden-toggle" id="fb-hidden-toggle">.*</button>
    <button class="fb-close" id="fb-close">&times;</button>
  </div>
  <div id="fb-list"></div>
</div>
<div id="fb-viewer">
  <div id="fbv-header">
    <button class="fbv-back" id="fbv-back">&larr;</button>
    <span class="fbv-path" id="fbv-path"></span>
  </div>
  <div id="fbv-content"></div>
</div>
<div id="messages"></div>
<div id="swipe-indicator"></div>
<div id="thinking"><div class="spinner"></div><span class="label">Agent is thinking...</span></div>
<button id="scroll-btn">&darr;</button>
<div id="input-area">
  <textarea id="prompt" rows="1" placeholder="Message the agent..." enterkeyhint="send"></textarea>
  <button id="send" disabled>Send</button>
  <button id="stop-btn">Stop</button>
</div>
</div><!-- /chat-view -->
<script nonce="__CSP_NONCE__" src="app.js"></script>
</body>
</html>
